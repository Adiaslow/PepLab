{% extends "base.html" %}
{% from "components/page_header.html" import page_header %}

{% block title %}Analysis{% endblock %}

{% block page_content %}
<div class="page-content">
    {{ page_header("Analysis") }}
    
    <div class="options-grid">
        <!-- Analysis options as cards -->
        <a href="{{ url_for('analysis.handle_analysis', analysis_type='cheminformatic') }}" class="option-card">
            <div class="option-card-icon">
                <i class="fas fa-atom"></i>
            </div>
            <h2 class="option-card-title">{{ display_names['cheminformatic'] }}</h2>
            <p class="option-card-description">{{ method_descriptions['cheminformatic'] }}</p>
        </a>
    </div>
</div>
{% endblock %}
